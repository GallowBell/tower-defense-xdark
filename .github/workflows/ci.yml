name: CI

# Verifies pull requests before they merge. Pushes to main are already
# checked by the Pages deploy workflow, which runs the same type check,
# tests and build on its way to publishing.
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -p tsconfig.json --noEmit && npx tsc -p tsconfig.node.json --noEmit

      - name: Lint
        run: npm run lint

      # Kept out of CI until the repo was actually formatted — a gate that
      # fails on every PR from day one just trains people to ignore it.
      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm test -- --run

      - name: Build
        run: npm run build

  e2e:
    name: Browser smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Only Chromium: the suite is a smoke check on one engine, not a
      # cross-browser matrix, and the download dominates the job's runtime.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # playwright.config.ts builds the app and serves it with vite preview,
      # so this runs against the production bundle rather than the dev server.
      - name: Run browser smoke tests
        run: npm run e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
